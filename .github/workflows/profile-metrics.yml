name: Update Profile Metrics

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      # -------------------------------------------------------
      # GitHub Stats Card
      # -------------------------------------------------------
      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=github_dark&hide_border=true&include_all_commits=true&rank_icon=github
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # -------------------------------------------------------
      # Top Languages Card
      # -------------------------------------------------------
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=github_dark&hide_border=true&langs_count=8
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # -------------------------------------------------------
      # Custom real-time repository metrics
      # -------------------------------------------------------
      - name: Generate repository metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path
          from xml.sax.saxutils import escape

          username = os.environ["GH_USER"]
          token = os.environ["GH_TOKEN"]

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": f"{username}-profile-metrics"
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)

              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          user = get_json(
              f"https://api.github.com/users/{username}"
          )

          repos = []
          page = 1

          while True:
              batch = get_json(
                  f"https://api.github.com/users/{username}/repos"
                  f"?type=owner&sort=updated&per_page=100&page={page}"
              )

              repos.extend(batch)

              if len(batch) < 100:
                  break

              page += 1

          public_repos = int(
              user.get("public_repos", len(repos))
          )

          followers = int(
              user.get("followers", 0)
          )

          total_stars = sum(
              int(repo.get("stargazers_count", 0))
              for repo in repos
              if not repo.get("fork")
          )

          total_forks = sum(
              int(repo.get("forks_count", 0))
              for repo in repos
              if not repo.get("fork")
          )

          values = [
              ("PUBLIC REPOS", str(public_repos)),
              ("STARS EARNED", str(total_stars)),
              ("FOLLOWERS", str(followers)),
              ("PUBLIC FORKS", str(total_forks))
          ]

          card_width = 210
          gap = 12
          padding = 16
          height = 112

          width = (
              padding * 2 +
              card_width * 4 +
              gap * 3
          )

          cards = []

          for i, (label, value) in enumerate(values):

              x = padding + i * (card_width + gap)

              cards.append(f"""
                <g transform="translate({x},16)">

                  <rect
                    width="{card_width}"
                    height="80"
                    rx="12"
                    fill="#0d1117"
                    stroke="#30363d"
                  />

                  <text
                    x="16"
                    y="31"
                    fill="#8b949e"
                    font-size="12"
                    font-family="Arial, Helvetica, sans-serif"
                    font-weight="700"
                  >
                    {escape(label)}
                  </text>

                  <text
                    x="16"
                    y="61"
                    fill="#58a6ff"
                    font-size="25"
                    font-family="Arial, Helvetica, sans-serif"
                    font-weight="700"
                  >
                    {escape(value)}
                  </text>

                </g>
              """)

          svg = f"""
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="{width}"
            height="{height}"
            viewBox="0 0 {width} {height}"
            role="img"
            aria-label="GitHub profile metrics"
          >

            <rect
              width="100%"
              height="100%"
              rx="14"
              fill="#010409"
            />

            {''.join(cards)}

          </svg>
          """

          output = Path(
              "assets/profile-metrics.svg"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          output.write_text(
              svg,
              encoding="utf-8"
          )

          print(
              f"Repos: {public_repos} | "
              f"Stars: {total_stars} | "
              f"Followers: {followers} | "
              f"Forks: {total_forks}"
          )

          PY
      # -------------------------------------------------------
      # Contribution Activity Graph
      # -------------------------------------------------------
      - name: Generate contribution activity graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from datetime import date, timedelta
          from pathlib import Path

          username = os.environ["GH_USER"]
          token = os.environ["GH_TOKEN"]

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {"login": username}
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": f"{username}-profile"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)

          weeks = result["data"]["user"]["contributionsCollection"][
              "contributionCalendar"
          ]["weeks"]

          contributions = {}

          for week in weeks:
              for day in week["contributionDays"]:
                  contributions[day["date"]] = day["contributionCount"]

          today = date.today()

          days = [
              today - timedelta(days=i)
              for i in range(30, -1, -1)
          ]

          values = [
              contributions.get(day.isoformat(), 0)
              for day in days
          ]

          width = 900
          height = 300

          left = 55
          right = 25
          top = 55
          bottom = 45

          graph_width = width - left - right
          graph_height = height - top - bottom

          max_value = max(values) if max(values) > 0 else 1

          points = []

          for i, value in enumerate(values):

              x = left + (
                  i / (len(values) - 1)
              ) * graph_width

              y = (
                  top +
                  graph_height -
                  (value / max_value) * graph_height
              )

              points.append((x, y))

          polyline = " ".join(
              f"{x:.1f},{y:.1f}"
              for x, y in points
          )

          circles = ""

          for (x, y), value in zip(points, values):

              circles += f"""
              <circle
                  cx="{x:.1f}"
                  cy="{y:.1f}"
                  r="3"
                  fill="#58a6ff"
              >
                <title>{value} contributions</title>
              </circle>
              """

          grid = ""

          for i in range(5):

              y = top + (graph_height / 4) * i

              grid += f"""
              <line
                  x1="{left}"
                  y1="{y:.1f}"
                  x2="{width-right}"
                  y2="{y:.1f}"
                  stroke="#21262d"
                  stroke-width="1"
              />
              """

          start_label = days[0].strftime("%d %b")
          end_label = days[-1].strftime("%d %b")

          total = sum(values)

          svg = f"""
          <svg
              xmlns="http://www.w3.org/2000/svg"
              width="{width}"
              height="{height}"
              viewBox="0 0 {width} {height}"
              role="img"
              aria-label="GitHub contribution activity graph"
          >

            <rect
                width="100%"
                height="100%"
                rx="14"
                fill="#0d1117"
                stroke="#30363d"
            />

            <text
                x="{left}"
                y="30"
                fill="#f0f6fc"
                font-size="17"
                font-family="Arial, Helvetica, sans-serif"
                font-weight="700"
            >
                Contribution Activity — Last 31 Days
            </text>

            <text
                x="{width-right}"
                y="30"
                text-anchor="end"
                fill="#8b949e"
                font-size="12"
                font-family="Arial, Helvetica, sans-serif"
            >
                {total} contributions
            </text>

            {grid}

            <polyline
                points="{polyline}"
                fill="none"
                stroke="#58a6ff"
                stroke-width="3"
                stroke-linejoin="round"
                stroke-linecap="round"
            />

            {circles}

            <text
                x="{left}"
                y="{height-15}"
                fill="#8b949e"
                font-size="11"
                font-family="Arial, Helvetica, sans-serif"
            >
                {start_label}
            </text>

            <text
                x="{width-right}"
                y="{height-15}"
                text-anchor="end"
                fill="#8b949e"
                font-size="11"
                font-family="Arial, Helvetica, sans-serif"
            >
                {end_label}
            </text>

          </svg>
          """

          output = Path("assets/activity-graph.svg")

          output.write_text(
              svg,
              encoding="utf-8"
          )

          print(
              f"Generated activity graph with "
              f"{total} contributions."
          )

          PY
      # -------------------------------------------------------
      # Save generated files
      # -------------------------------------------------------
      - name: Commit updated analytics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.svg
          git add assets/top-langs.svg
          git add assets/profile-metrics.svg

          if git diff --cached --quiet; then
            echo "No analytics changes."
          else
            git commit -m "chore: update GitHub profile analytics"
            git push
          fi
