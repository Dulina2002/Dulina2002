name: Update Profile Metrics

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      # -------------------------------------------------------
      # GitHub Stats Card
      # -------------------------------------------------------
      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=github_dark&hide_border=true&include_all_commits=true&rank_icon=github
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # -------------------------------------------------------
      # Top Languages Card
      # -------------------------------------------------------
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=github_dark&hide_border=true&langs_count=8
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # -------------------------------------------------------
      # Custom real-time repository metrics
      # -------------------------------------------------------
      - name: Generate repository metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path
          from xml.sax.saxutils import escape

          username = os.environ["GH_USER"]
          token = os.environ["GH_TOKEN"]

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": f"{username}-profile-metrics"
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)

              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          user = get_json(
              f"https://api.github.com/users/{username}"
          )

          repos = []
          page = 1

          while True:
              batch = get_json(
                  f"https://api.github.com/users/{username}/repos"
                  f"?type=owner&sort=updated&per_page=100&page={page}"
              )

              repos.extend(batch)

              if len(batch) < 100:
                  break

              page += 1

          public_repos = int(
              user.get("public_repos", len(repos))
          )

          followers = int(
              user.get("followers", 0)
          )

          total_stars = sum(
              int(repo.get("stargazers_count", 0))
              for repo in repos
              if not repo.get("fork")
          )

          total_forks = sum(
              int(repo.get("forks_count", 0))
              for repo in repos
              if not repo.get("fork")
          )

          values = [
              ("PUBLIC REPOS", str(public_repos)),
              ("STARS EARNED", str(total_stars)),
              ("FOLLOWERS", str(followers)),
              ("PUBLIC FORKS", str(total_forks))
          ]

          card_width = 210
          gap = 12
          padding = 16
          height = 112

          width = (
              padding * 2 +
              card_width * 4 +
              gap * 3
          )

          cards = []

          for i, (label, value) in enumerate(values):

              x = padding + i * (card_width + gap)

              cards.append(f"""
                <g transform="translate({x},16)">

                  <rect
                    width="{card_width}"
                    height="80"
                    rx="12"
                    fill="#0d1117"
                    stroke="#30363d"
                  />

                  <text
                    x="16"
                    y="31"
                    fill="#8b949e"
                    font-size="12"
                    font-family="Arial, Helvetica, sans-serif"
                    font-weight="700"
                  >
                    {escape(label)}
                  </text>

                  <text
                    x="16"
                    y="61"
                    fill="#58a6ff"
                    font-size="25"
                    font-family="Arial, Helvetica, sans-serif"
                    font-weight="700"
                  >
                    {escape(value)}
                  </text>

                </g>
              """)

          svg = f"""
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="{width}"
            height="{height}"
            viewBox="0 0 {width} {height}"
            role="img"
            aria-label="GitHub profile metrics"
          >

            <rect
              width="100%"
              height="100%"
              rx="14"
              fill="#010409"
            />

            {''.join(cards)}

          </svg>
          """

          output = Path(
              "assets/profile-metrics.svg"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          output.write_text(
              svg,
              encoding="utf-8"
          )

          print(
              f"Repos: {public_repos} | "
              f"Stars: {total_stars} | "
              f"Followers: {followers} | "
              f"Forks: {total_forks}"
          )

          PY

      # -------------------------------------------------------
      # Save generated files
      # -------------------------------------------------------
      - name: Commit updated analytics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.svg
          git add assets/top-langs.svg
          git add assets/profile-metrics.svg

          if git diff --cached --quiet; then
            echo "No analytics changes."
          else
            git commit -m "chore: update GitHub profile analytics"
            git push
          fi
